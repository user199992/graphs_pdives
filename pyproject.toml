[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphs_pdives"
version = "0.0.1"
description = "A small graph algorithms library featuring Dijkstra's shortest path algorithm."
authors = [
    { name = "Pete Dives", email = "pdives@msudenver.edu" }
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]
